    Exemplo 14 — Relatórios com múltiplos problemas

    Relato:
    "Problemas nos relatórios gerenciais: GET /api/reports/executive-dashboard executa N+1 e leva 45 segundos para um SLA de 3s; o MRR diverge entre dashboard R$ 150.000, financeiro R$ 145.000 e contábil R$ 147.500; Redis usa TTL de 24 horas; a exportação anual em CSV chega a 100% de CPU, 4GB de memória com limite de 2GB e termina em OOM. Há 15 clientes enterprise em risco e o CS gasta 40h/semana."

    Saída:
    Como executivo usando o sistema de relatórios, eu quero receber métricas precisas, consistentes e atualizadas dentro do tempo esperado, para que eu possa tomar decisões estratégicas com dados confiáveis.

    === USER STORY PRINCIPAL ===

    Título: Sistema de relatórios gerenciais confiável e performático

    Descrição:
    Como um usuário executivo (CEO, CFO, VP), eu quero acessar dashboards e relatórios gerenciais que sejam rápidos, precisos e consistentes em todas as fontes, para que eu possa confiar nos dados para tomada de decisão estratégica.

    === CRITÉRIOS DE ACEITAÇÃO ===

    A. Performance - Dashboard carrega em menos de 3 segundos:
    - Dado que sou um executivo acessando o dashboard
    - Quando carrego GET /api/reports/executive-dashboard
    - Então a página deve carregar completamente em < 3 segundos
    - E o database CPU deve ficar abaixo de 70% mesmo em horário de pico
    - E deve funcionar para empresas com até 10.000 usuários

    B. Dados Consistentes - MRR igual em todas as fontes:
    - Dado que consulto o MRR (Monthly Recurring Revenue)
    - Quando verifico dashboard, relatório financeiro e API
    - Então o valor deve ser idêntico em todas as fontes
    - E deve seguir a regra de negócio acordada
    - E deve considerar assinaturas ativas + pró-rata de mudanças

    C. Cache Inteligente - Dados sempre atualizados:
    - Dado que um cliente faz upgrade ou downgrade de plano
    - Quando acesso o dashboard em até 30 segundos após a mudança
    - Então devo ver os dados atualizados
    - E o cache deve ser invalidado automaticamente
    - E dados críticos (MRR, Active Users) não devem usar cache maior que 5 minutos

    D. Exportação Assíncrona - CSV não trava servidor:
    - Dado que solicito exportação de relatório anual
    - Quando clico em "Exportar para CSV"
    - Então a exportação deve processar em background
    - E devo receber notificação quando concluir
    - E outras requisições não devem ser afetadas
    - E o servidor não deve ultrapassar 80% de memória

    === CRITÉRIOS TÉCNICOS ===

    Performance - Resolver N+1:
    - Implementar eager loading com JOIN
    - Reduzir centenas de queries para poucas queries agregadas
    - Usar materialized views para métricas complexas
    - Adicionar índices nas FKs mais usadas

    Lógica de Negócio - MRR Padronizado:
    - Criar função centralizada de cálculo de MRR usada por todos
    - Regra: assinaturas ativas + pró-rata de mudanças no mês
    - Documentar a fórmula e cobrir com testes

    Cache - Estratégia Híbrida:
    - Dados críticos com cache curto (5 min): MRR, Active Users
    - Dados históricos com cache mais longo (1h)
    - Invalidação automática via eventos
    - Não manter TTL de 24 horas para métricas críticas

    Exportação - Background Jobs:
    - Processar em fila, sem bloquear as outras requisições
    - Streaming de CSV, sem carregar tudo na memória
    - Notificar por e-mail ou webhook ao concluir

    === CONTEXTO DO BUG ===

    Severidade: CRÍTICA

    Impacto: 15 clientes enterprise em risco de churn; 40h/semana de CS; MRR divergente entre R$ 150.000, R$ 145.000 e R$ 147.500

    Problemas Identificados:
    1. N+1 no GET /api/reports/executive-dashboard (45s contra SLA de 3s)
    2. MRR calculado diferente em dashboard, financeiro e contábil
    3. Cache de 24h desatualizado
    4. Export síncrono eleva memória a 4GB (limite 2GB) e causa OOM

    === TASKS TÉCNICAS SUGERIDAS ===

    1. [PERF] Eliminar N+1 e adicionar índices
    2. [LOGIC] Centralizar o cálculo de MRR
    3. [CACHE] Reduzir TTL das métricas críticas e invalidar por evento
    4. [EXPORT] Mover a exportação CSV para background

